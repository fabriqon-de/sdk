<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PlantFrame SDK · Browser-Beispiel</title><style>body{margin:0;background:#0f1720;color:#f5f6f7;font:16px system-ui}header{padding:20px}#scene{height:70vh}#selection{padding:16px}</style><script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script></head><body><header>PlantFrame SDK · eigenständiges Browser-Beispiel</header><button id="pause" type="button" aria-pressed="false">Animation pausieren</button> <button id="fit" type="button">Kamera einpassen</button><div id="scene"></div><p id="selection" aria-live="polite">Bauteil anklicken oder Pfeiltasten verwenden.</p><script type="module">
import { createViewer } from '../../dist/viewer.js';
const viewer = createViewer(document.querySelector('#scene'), { autoRotate: true, maxFps: 30, onSelect(id) { document.querySelector('#selection').textContent = id ? `Auswahl: ${id}` : 'Keine Auswahl'; } });
viewer.setModel({schemaVersion:1,name:'Example',assets:[{id:'machine-1',name:'Machine',shape:'box',kind:'machine',position:{x:-2,y:0,z:0},size:{x:2,y:2,z:1},color:0xffb703},{id:'controller-1',name:'Controller',shape:'box',kind:'controller',position:{x:2,y:0,z:0},size:{x:1,y:2,z:1},color:0x61aee0}],connections:[{id:'link-1',sourceId:'machine-1',targetId:'controller-1'}]});
let paused = matchMedia('(prefers-reduced-motion: reduce)').matches;
const pause = document.querySelector('#pause');
function syncPause() { pause.setAttribute('aria-pressed', String(paused)); pause.textContent = paused ? 'Animation fortsetzen' : 'Animation pausieren'; viewer.setPaused(paused); }
pause.addEventListener('click', () => { paused = !paused; syncPause(); });
document.querySelector('#fit').addEventListener('click', () => viewer.fit());
syncPause();
window.addEventListener('pagehide', () => viewer.dispose(), {once:true});
</script></body></html>
