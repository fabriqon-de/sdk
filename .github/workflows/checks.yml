name: SDK checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24', '26']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:package

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run docs:build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:docs
      - name: Check SDK packaging after documentation build
        run: npm run test:package
  docs-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: docker build -f Dockerfile.docs -t plantframe-docs:ci .
      - name: Start unprivileged static documentation
        run: docker run -d --name plantframe-docs-ci --read-only --tmpfs /tmp:uid=101,gid=101,mode=1777 -p 127.0.0.1:8081:8080 plantframe-docs:ci
      - name: Wait for documentation
        run: |
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8081/healthz && exit 0; sleep 2; done
          exit 1
      - run: node scripts/smoke-docs.mjs
      - name: Logs on failure
        if: failure()
        run: docker logs plantframe-docs-ci
      - name: Stop test container
        if: always()
        run: docker rm -f plantframe-docs-ci
